<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Better Brush</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><i class="mark"></i>Better&nbsp;Brush</span>
      <span id="statusPill" class="pill" title="Local engine status">
        <i id="statusDot" class="dot"></i><span id="statusText">connecting</span>
      </span>
    </header>

    <main class="body">
      <section id="hero" class="hero">
        <div id="heroIcon" class="hero-icon"></div>
        <h1 id="heroTitle" class="hero-title">Checking the selection…</h1>
        <p id="heroText" class="hero-text"></p>

        <div id="layerChip" class="chip hidden">
          <span id="layerName" class="chip-name">—</span>
          <span id="layerMeta" class="chip-meta">—</span>
        </div>

        <div id="elapsed" class="elapsed hidden">0:00</div>

        <ol id="stages" class="stages hidden">
          <li data-stage="load"><i></i><span>Loading the model</span></li>
          <li data-stage="extract"><i></i><span>Reading the source</span></li>
          <li data-stage="analyze"><i></i><span>Finding the character</span></li>
          <li data-stage="propagate"><i></i><span>Tracking through the clip</span></li>
          <li data-stage="matte"><i></i><span>Refining the edges</span></li>
          <li data-stage="export"><i></i><span>Writing the alpha movie</span></li>
        </ol>

        <div id="progressWrap" class="progress hidden">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressMeta" class="progress-meta"></p>

        <figure id="previewWrap" class="preview hidden">
          <div id="brushStage" class="checker brush-stage">
            <img id="previewImg" alt="Preview of the cut-out" />
            <canvas id="brushCanvas" class="brush-canvas hidden"></canvas>
          </div>
          <figcaption id="previewCaption"></figcaption>

          <div id="brushTools" class="brush-tools hidden">
            <div class="brush-row">
              <div id="brushToolSeg" class="seg">
                <button type="button" data-value="add" class="on" title="Paint pixels in">Add</button>
                <button type="button" data-value="remove" title="Paint pixels out">Remove</button>
              </div>
            </div>
            <div class="brush-row">
              <span class="label">Brush</span>
              <input id="brushSize" type="range" min="10" max="160" step="2" value="48" />
            </div>
            <div class="brush-row brush-actions">
              <button id="brushClear" type="button" class="ghost">Clear strokes</button>
              <button id="brushApply" type="button" class="ghost">Apply correction</button>
            </div>
            <p class="note">Paint on the key frame — green adds, red removes — then Apply. The clip is re-tracked.</p>
          </div>
        </figure>

        <button id="heroAction" type="button" class="ghost hidden"></button>
      </section>

      <p id="notice" class="notice hidden"></p>
      <p id="noticeDetail" class="notice-detail hidden"></p>
    </main>

    <footer class="dock">
      <div class="opt">
        <span class="label">Quality</span>
        <div id="qualitySeg" class="seg">
          <button type="button" data-value="tiny" title="SAM 2.1 Tiny — fastest, rough edges">Tiny</button>
          <button type="button" data-value="fast" title="SAM 2.1 Small">Fast</button>
          <button type="button" data-value="balanced" class="on" title="SAM 2.1 Base+">Balanced</button>
          <button type="button" data-value="best" title="Best installed checkpoint">Best</button>
        </div>
        <span id="modelNote" class="note">—</span>
      </div>

      <div class="opt">
        <span class="label">Result</span>
        <div id="modeSeg" class="seg">
          <button type="button" data-value="replace" class="on">Replace layer</button>
          <button type="button" data-value="add">New layer</button>
        </div>
      </div>

      <div class="opt">
        <label class="toggle" title="Refine the cut-out into a soft alpha — hair, motion blur and partial edges">
          <input id="mattingToggle" type="checkbox" checked />
          <span>Automatic matting <em>soft edges &amp; hair</em></span>
        </label>
        <span id="mattingNote" class="note"></span>
      </div>

      <button id="runBtn" type="button" class="primary">Remove Background</button>
      <div class="dock-row">
        <button id="cancelBtn" type="button" class="ghost hidden">Cancel</button>
        <button id="openAppBtn" type="button" class="ghost">Open full app</button>
      </div>
    </footer>

    <script src="js/panel.js"></script>
  </body>
</html>
